server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI service (full /api/... path preserved). This also covers the
    # OAuth authorization-server endpoints at /api/oauth/{register,authorize,token}.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Remote MCP endpoint (streamable HTTP / SSE) — served by the mcp service. Streaming responses
    # must not be buffered, and long-lived reads need a generous timeout.
    location /mcp {
        proxy_pass http://mcp:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # OAuth protected-resource metadata (RFC 9728) — served by the mcp service (resource server).
    location /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth authorization-server metadata (RFC 8414) — served by the api (authorization server).
    location /.well-known/oauth-authorization-server {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

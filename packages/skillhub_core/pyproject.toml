[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub-core"
version = "0.1.0"
description = "Shared core for SkillHub: parsing, models, embeddings, repository, ingest pipeline."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9,<3",
    "pgvector>=0.2.5,<0.4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    # Local embeddings for search / duplicate detection. The service does NOT call an LLM —
    # evaluation is done by Claude Code and submitted back via the API.
    "sentence-transformers>=2.7,<4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skillhub_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

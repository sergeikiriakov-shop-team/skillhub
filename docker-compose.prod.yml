# Production compose for a single host (no domain, GitHub OAuth over http on the public IP).
# Only the web portal is published; api + db stay on the internal docker network (nginx proxies
# /api -> api:8000). Uses the built images (no source bind-mounts, no --reload). Values come from
# a server-side .env (never committed). Bring up with:
#   docker compose -f docker-compose.prod.yml up -d --build
name: skillhub

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillhub}
      POSTGRES_DB: ${POSTGRES_DB:-skillhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillhub} -d ${POSTGRES_DB:-skillhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: skillhub-api
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      POSTGRES_USER: ${POSTGRES_USER:-skillhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillhub}
      POSTGRES_DB: ${POSTGRES_DB:-skillhub}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SKILLHUB_CORS_ORIGINS: ${SKILLHUB_CORS_ORIGINS:-}
      SKILLHUB_PUBLIC_URL: ${SKILLHUB_PUBLIC_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      SKILLHUB_GITHUB_ORG: ${SKILLHUB_GITHUB_ORG:-}
      SKILLHUB_SESSION_TTL: ${SKILLHUB_SESSION_TTL:-1209600}
      SKILLHUB_PUBLIC_READS: ${SKILLHUB_PUBLIC_READS:-true}
      SKILLHUB_DEFAULT_ROLE: ${SKILLHUB_DEFAULT_ROLE:-viewer}
      SKILLHUB_OPEN_REVIEW: ${SKILLHUB_OPEN_REVIEW:-true}
      SKILLHUB_BOOTSTRAP_ADMINS: ${SKILLHUB_BOOTSTRAP_ADMINS:-}
      SKILLHUB_COOKIE_SECURE: ${SKILLHUB_COOKIE_SECURE:-false}
      SKILLHUB_ADMIN_TOKEN: ${SKILLHUB_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Cache the embedding model between restarts (first run downloads it once).
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    # No published ports: reached only via the web nginx proxy on the internal network.

  # Remote MCP server (streamable HTTP). Hosts the SkillHub MCP so developers connect with a single
  # `claude mcp add --transport http ...` and authenticate in the browser via OAuth — no local Docker.
  # Resource server: validates the Bearer against the api and forwards it; the api is the OAuth AS.
  mcp:
    image: skillhub-mcp
    build:
      context: services/mcp
      dockerfile: Dockerfile
    environment:
      SKILLHUB_MCP_TRANSPORT: http
      SKILLHUB_URL: http://api:8000
      SKILLHUB_PUBLIC_URL: ${SKILLHUB_PUBLIC_URL:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9000"
    depends_on:
      - api
    restart: unless-stopped
    # No published port — reached only via the web nginx proxy (/mcp) on the internal network.

  web:
    image: skillhub-web
    build:
      context: .
      dockerfile: services/web/Dockerfile
    depends_on:
      - api
      - mcp
    restart: unless-stopped
    # No published port — reached only via the caddy reverse proxy (https) on the internal network.

  # TLS terminator / reverse proxy. Set SKILLHUB_DOMAIN (e.g. <ip>.sslip.io) to enable it.
  # Auto-obtains a Let's Encrypt cert; needs ports 80 + 443 reachable.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      SKILLHUB_DOMAIN: ${SKILLHUB_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
  caddy_data:
  caddy_config:
